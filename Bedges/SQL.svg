<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="180" height="205">
  <defs>
    <!-- 3D Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#F5C427" />
      <stop offset="100%" stop-color="#C8960C" />
    </linearGradient>
    
    <!-- 3D Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#9E7204" />
    </linearGradient>

    <!-- 3D Drop Shadow -->
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Star Shape -->
    <polygon id="star" points="0,-7 2.1,-2.2 7.3,-1.6 3.5,2 4.5,7.2 0,4.6 -4.5,7.2 -3.5,2 -7.3,-1.6 -2.1,-2.2" fill="#2C3545" />
  </defs>

  <style>
    .badge-group {
      transform-origin: center;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .title {
      font-family: 'Segoe UI', Ubuntu, Sans-Serif;
      font-size: 20px;
      font-weight: 700;
      fill: #2C3545;
      text-anchor: middle;
    }
  </style>

  <g class="badge-group" filter="url(#shadow3d)">
    <!-- 3D Extrusion Base (Bottom Layer) -->
    <path d="M110,22 L195,70 L195,166 L110,214 L25,166 L25,70 Z" fill="#8A6200" stroke="#8A6200" stroke-width="16" stroke-linejoin="round" />

    <!-- Main Hexagon Body -->
    <path d="M110,15 L195,63 L195,159 L110,207 L25,159 L25,63 Z" fill="url(#goldGrad)" stroke="url(#rimGrad)" stroke-width="12" stroke-linejoin="round" />

    <!-- Inner 3D Bevel Line -->
    <path d="M110,25 L185,68 L185,154 L110,197 L35,154 L35,68 Z" fill="none" stroke="#FFE885" stroke-width="2" stroke-linejoin="round" opacity="0.6" />

    <!-- SQL Database Icon -->
    <g transform="translate(110, 72)" fill="none" stroke="#2C3545" stroke-width="3.8" stroke-linecap="round">
      <ellipse cx="0" cy="-14" rx="22" ry="7" />
      <path d="M-22,-5 C-22,2 22,2 22,-5" />
      <path d="M-22,5 C-22,12 22,12 22,5" />
      <path d="M-22,15 C-22,22 22,22 22,15" />
    </g>

    <!-- Badge Text -->
    <text x="110" y="138" class="title">Sql</text>

    <!-- 5 Stars -->
    <g transform="translate(110, 162)">
      <use href="#star" x="-40" />
      <use href="#star" x="-20" />
      <use href="#star" x="0" />
      <use href="#star" x="20" />
      <use href="#star" x="40" />
    </g>
  </g>
</svg>