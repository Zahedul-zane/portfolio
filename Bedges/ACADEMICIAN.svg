<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="190" height="205">
  <defs>
    <!-- Background & Sphere Gradients -->
    <radialGradient id="sphereGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#228FA6" />
      <stop offset="70%" stop-color="#114B5F" />
      <stop offset="100%" stop-color="#09232E" />
    </radialGradient>

    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD13B" />
      <stop offset="100%" stop-color="#F26419" />
    </linearGradient>

    <!-- 3D Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#9FEF00" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    .hud-spin {
      transform-origin: 120px 105px;
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .badge-label {
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 800;
      fill: #182232;
      text-anchor: middle;
    }
  </style>

  <!-- Transparent Background -->
  <rect width="240" height="260" rx="18" fill="none" />

  <g class="hud-spin" filter="url(#neonGlow)">
    <!-- Outer Segmented HUD Ring -->
    <circle cx="120" cy="105" r="72" fill="none" stroke="#9FEF00" stroke-width="2" opacity="0.5" />
    <circle cx="120" cy="105" r="68" fill="none" stroke="#9FEF00" stroke-width="6" stroke-dasharray="70 35 45 25 90 40" />
    <circle cx="120" cy="105" r="61" fill="none" stroke="#182232" stroke-width="4" />

    <!-- Inner 3D Orb -->
    <circle cx="120" cy="105" r="58" fill="url(#sphereGrad)" stroke="#38AECC" stroke-width="3" />

    <!-- Red Left Highlight Arc -->
    <path d="M68,85 A55,55 0 0,1 95,56 L78,115 Z" fill="#E05A47" opacity="0.7" />

    <!-- Character Shoulders / Robe -->
    <path d="M75,130 Q120,105 165,130 L152,157 Q120,168 88,157 Z" fill="url(#robeGrad)" />

    <!-- White Hood & Scarf -->
    <path d="M92,115 Q120,135 148,115 L160,132 Q120,152 80,132 Z" fill="#E8EEF2" />
    <path d="M100,82 C100,55 140,55 140,82 L146,115 Q120,128 94,115 Z" fill="#FFFFFF" />

    <!-- Ninja Mask & Eyes -->
    <path d="M106,84 Q120,78 134,84 L131,105 L120,115 L109,105 Z" fill="#1B263B" />
    <path d="M120,82 L134,84 L131,105 L120,115 Z" fill="#00B4D8" />
    <path d="M108,86 L118,88 M122,88 L132,86" stroke="#F4A261" stroke-width="2.5" stroke-linecap="round" />

    <!-- Open Book -->
    <path d="M85,126 L120,136 L155,126 L148,154 L120,164 L92,154 Z" fill="#083D77" />
    <path d="M89,122 L120,133 L151,122 L148,127 L120,137 L92,127 Z" fill="#D4A373" />

    <!-- Top Cube Node -->
    <g transform="translate(120, 35)">
      <circle cx="0" cy="0" r="15" fill="#182232" stroke="#9FEF00" stroke-width="2.5" />
      <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" fill="none" stroke="#9FEF00" stroke-width="1.5" />
      <path d="M0,-7 L0,0 M0,0 L6,3.5 M0,0 L-6,3.5" stroke="#9FEF00" stroke-width="1.5" />
    </g>

    <!-- Bottom-Left Book Node -->
    <g transform="translate(74, 148)">
      <circle cx="0" cy="0" r="22" fill="#182232" stroke="#9FEF00" stroke-width="2.5" />
      <rect x="-10" y="-7" width="20" height="14" rx="2" fill="none" stroke="#9FEF00" stroke-width="1.8" />
      <rect x="-10" y="-7" width="9" height="14" fill="#9FEF00" />
    </g>
  </g>

  <!-- Title -->
  <text x="120" y="232" class="badge-label">Academician</text>
</svg>